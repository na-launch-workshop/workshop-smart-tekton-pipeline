apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  labels:
    app.kubernetes.io/part-of: smart-pipeline
spec:
  description: Clones a git repository into the workspace.
  params:
    - name: url
      type: string
      description: Git repository URL
    - name: revision
      type: string
      default: "main"
      description: Branch, tag, or commit SHA to checkout
  workspaces:
    - name: output
      description: Cloned repository destination
  steps:
    - name: clone
      image: alpine/git:2.43.0
      script: |
        #!/bin/sh
        set -eu        
        echo "Cloning $(params.url) @ $(params.revision)"
        git clone --depth 1 --branch "$(params.revision)" \
          "$(params.url)" "$(workspaces.output.path)/source"
        cd "$(workspaces.output.path)/source"
        git log --oneline -1
        echo "Clone complete."
