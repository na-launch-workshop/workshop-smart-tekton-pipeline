apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: claude-review
  labels:
    app.kubernetes.io/part-of: smart-pipeline
spec:
  description: >
    LangChain agent that actively investigates code changes using tools
    (linter, secrets scan, CVE audit, tests, complexity) before making a review decision.
  params:
    - name: model
      type: string
      default: "claude-sonnet-5"
      description: Claude model to use
    - name: rules-path
      type: string
      default: "rules/review-rules.json"
      description: Path to the review rules file relative to the repo root
    - name: base-ref
      type: string
      default: "origin/main"
      description: Base git ref to diff against
  workspaces:
    - name: source
      description: The cloned source code
  results:
    - name: decision
      description: "Review decision: approve, warn, or block"
    - name: summary
      description: Brief summary of the review findings
    - name: findings-count
      description: Number of findings reported
  steps:
    - name: review
      image: image-registry.openshift-image-registry.svc:5000/workspace-images/smart-pipeline-review:latest
      env:
        - name: CLAUDE_MODEL
          value: "$(params.model)"
        - name: RULES_PATH
          value: "$(params.rules-path)"
        - name: BASE_REF
          value: "$(params.base-ref)"
        - name: WORKSPACE
          value: "$(workspaces.source.path)/source"
        - name: DECISION_PATH
          value: "$(results.decision.path)"
        - name: SUMMARY_PATH
          value: "$(results.summary.path)"
        - name: COUNT_PATH
          value: "$(results.findings-count.path)"
      script: |
        #!/bin/sh
        exec python3 /workspace/review.py
