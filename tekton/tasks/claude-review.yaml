apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: claude-review
  labels:
    app.kubernetes.io/part-of: smart-pipeline
spec:
  description: >
    LangChain agent that actively investigates code changes using tools
    (linter, secrets scan, CVE audit, tests) before making a review decision.
  params:
    - name: model
      type: string
      default: "claude-sonnet-5"
      description: Claude model to use
    - name: rules-path
      type: string
      default: "rules/review-rules.json"
      description: Path to the review rules file relative to the repo root
    - name: base-ref
      type: string
      default: "origin/main"
      description: Base git ref to diff against
  workspaces:
    - name: source
      description: The cloned source code
  results:
    - name: decision
      description: "Review decision: approve, warn, or block"
    - name: summary
      description: Brief summary of the review findings
    - name: findings-count
      description: Number of findings reported
  steps:
    - name: review
      image: image-registry.openshift-image-registry.svc:5000/workspace-images/smart-pipeline-review:latest
      env:
        - name: CLAUDE_MODEL
          value: "$(params.model)"
        - name: RULES_PATH
          value: "$(params.rules-path)"
        - name: BASE_REF
          value: "$(params.base-ref)"
        - name: WORKSPACE
          value: "$(workspaces.source.path)/source"
      script: |
        #!/usr/bin/env python3
        import json, os, subprocess, sys
        from pathlib import Path

        import urllib.request, urllib.error

        from langchain_anthropic import ChatAnthropic
        from langchain_core.tools import tool
        from langgraph.prebuilt import create_react_agent

        VAULT_ADDR  = os.environ.get("VAULT_ADDR", "https://vault-vault.apps.cluster-x7f6f.dyn.redhatworkshops.io")
        VAULT_ROLE  = os.environ.get("VAULT_ROLE", "smart-pipeline-role")
        VAULT_PATH  = os.environ.get("VAULT_PATH", "kv/data/secrets/common/anthropic")
        SA_JWT_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"

        MODEL      = os.environ.get("CLAUDE_MODEL", "claude-sonnet-5")
        WORKSPACE  = os.environ["WORKSPACE"]
        RULES_PATH = os.environ.get("RULES_PATH", "rules/review-rules.json")
        BASE_REF   = os.environ.get("BASE_REF", "origin/main")

        DECISION_PATH = "$(results.decision.path)"
        SUMMARY_PATH  = "$(results.summary.path)"
        COUNT_PATH    = "$(results.findings-count.path)"

        IGNORED_DIRS = {'.git', 'node_modules', '__pycache__', '.venv',
                        'vendor', '.tox', '.mypy_cache', 'dist', 'build'}
        CODE_EXTENSIONS = {'.py', '.go', '.js', '.ts', '.jsx', '.tsx', '.java',
                           '.rb', '.rs', '.c', '.cpp', '.h', '.cs', '.sh',
                           '.yaml', '.yml', '.json', '.tf', '.hcl', '.sql'}
        CODE_FILENAMES = {'Dockerfile', 'Makefile', 'Jenkinsfile', 'Taskfile'}

        DEFAULT_RULES = {
            "rules": [
                {"id": "obvious-bugs",   "name": "Obvious Bugs",
                 "description": "Logic errors, off-by-one, null dereferences, infinite loops",
                 "severity": "block", "enabled": True},
                {"id": "secrets-leak",   "name": "Hardcoded Secrets",
                 "description": "Passwords, API keys, tokens, or credentials in code",
                 "severity": "block", "enabled": True},
                {"id": "injection",      "name": "SQL/Command Injection",
                 "description": "Unsanitized user input in SQL queries or shell commands",
                 "severity": "block", "enabled": True},
                {"id": "resource-leaks", "name": "Resource Leaks",
                 "description": "Unclosed files, DB connections, sockets",
                 "severity": "block", "enabled": True},
                {"id": "error-handling", "name": "Error Handling Gaps",
                 "description": "Missing error handling, swallowed exceptions",
                 "severity": "warn", "enabled": True},
                {"id": "code-smell",     "name": "Code Smells",
                 "description": "Complex functions, poor naming, duplication",
                 "severity": "warn", "enabled": True},
            ],
            "thresholds": {"max_block_findings": 0, "max_warn_findings": 5}
        }

        SYSTEM_PROMPT = """\
        You are a code review agent in a CI/CD pipeline acting as a senior developer.

        You have tools to actively investigate the code before reaching a verdict:
        - run_linter: flake8 syntax and style check
        - check_secrets: detect-secrets scan for hardcoded credentials
        - audit_dependencies: pip-audit CVE check on requirements files
        - run_tests: execute pytest and return results
        - read_file: read any file in the repo for additional context

        Use the tools that are relevant to what you see in the diff. You do not need
        to run all of them — be selective and practical.

        After investigating, respond with ONLY a valid JSON object in this exact schema:
        {{
          "decision": "approve | warn | block",
          "summary": "1-2 sentence overall assessment",
          "findings": [
            {{
              "rule_id": "rule id string",
              "severity": "block | warn | info",
              "file": "file path or empty string",
              "line": null,
              "title": "short title",
              "description": "clear explanation"
            }}
          ],
          "suggestions": ["optional quick wins"]
        }}

        Decision guidelines:
        - "approve": no significant issues, code is ready to build
        - "warn":    concerns worth noting but build can proceed
        - "block":   serious issues that must be fixed before building

        Active rules to enforce:
        {rules}
        """

        # ── tools ────────────────────────────────────────────────────────────

        @tool
        def run_linter() -> str:
            """Run flake8 on the source tree. Returns style and syntax findings."""
            r = subprocess.run(
                ["flake8", "--max-line-length=120", WORKSPACE],
                capture_output=True, text=True
            )
            return r.stdout.strip() or "No linter issues found."

        @tool
        def check_secrets() -> str:
            """Scan the repo for hardcoded secrets using detect-secrets."""
            r = subprocess.run(
                ["detect-secrets", "scan", WORKSPACE],
                capture_output=True, text=True
            )
            try:
                data = json.loads(r.stdout)
                hits = data.get("results", {})
                if hits:
                    return f"Potential secrets found:\n{json.dumps(hits, indent=2)}"
                return "No secrets detected."
            except Exception:
                return r.stdout.strip() or "Scan completed with no output."

        @tool
        def audit_dependencies() -> str:
            """Check Python requirements files for known CVEs using pip-audit."""
            req_files = list(Path(WORKSPACE).rglob("requirements*.txt"))
            if not req_files:
                return "No requirements.txt found — skipping."
            results = []
            for req in req_files:
                r = subprocess.run(
                    ["pip-audit", "-r", str(req), "--format", "json"],
                    capture_output=True, text=True
                )
                try:
                    data = json.loads(r.stdout)
                    vulns = [d for d in data.get("dependencies", []) if d.get("vulns")]
                    results.append(
                        f"{req.name}: {json.dumps(vulns, indent=2)}" if vulns
                        else f"{req.name}: No vulnerabilities found."
                    )
                except Exception:
                    results.append(f"{req.name}: {(r.stdout or r.stderr).strip()}")
            return "\n".join(results)

        @tool
        def run_tests() -> str:
            """Run pytest and return pass/fail results."""
            r = subprocess.run(
                ["pytest", WORKSPACE, "-v", "--tb=short", "--no-header", "-q"],
                capture_output=True, text=True, timeout=120
            )
            output = (r.stdout + r.stderr).strip()
            return output[:5000] if output else "No test output."

        @tool
        def read_file(filepath: str) -> str:
            """Read a file from the repo by relative path for additional context."""
            workspace = Path(WORKSPACE).resolve()
            target = (workspace / filepath).resolve()
            if not str(target).startswith(str(workspace)):
                return f"Access denied: path is outside the workspace."
            if not target.exists():
                return f"File not found: {filepath}"
            try:
                return target.read_text()[:10_000]
            except Exception as e:
                return f"Error reading file: {e}"

        # ── helpers ──────────────────────────────────────────────────────────

        def run_git(*args):
            return subprocess.run(
                ["git"] + list(args), capture_output=True, text=True, cwd=WORKSPACE
            )

        def get_code_changes():
            for ref in [BASE_REF, "HEAD~1"]:
                r = run_git("diff", ref, "HEAD")
                if r.returncode == 0 and r.stdout.strip():
                    return r.stdout[:100_000]
            print("No git diff — reviewing all source files")
            parts, total = [], 0
            for root, dirs, files in os.walk(WORKSPACE):
                dirs[:] = [d for d in dirs if d not in IGNORED_DIRS]
                for fname in sorted(files):
                    if os.path.splitext(fname)[1] not in CODE_EXTENSIONS and fname not in CODE_FILENAMES:
                        continue
                    fpath = os.path.join(root, fname)
                    try:
                        with open(fpath) as f:
                            content = f.read(50_000)
                    except Exception:
                        continue
                    chunk = f"=== {os.path.relpath(fpath, WORKSPACE)} ===\n{content}\n"
                    parts.append(chunk)
                    total += len(chunk)
                    if total > 100_000:
                        break
                if total > 100_000:
                    break
            return "\n".join(parts)[:100_000]

        def load_rules():
            path = os.path.join(WORKSPACE, RULES_PATH)
            if os.path.isfile(path):
                with open(path) as f:
                    return json.load(f)
            return DEFAULT_RULES

        def parse_review(text):
            text = text.strip()
            if text.startswith("```"):
                text = text.split("\n", 1)[1]
            if text.endswith("```"):
                text = text.rsplit("```", 1)[0]
            text = text.strip()
            try:
                return json.loads(text)
            except json.JSONDecodeError:
                s, e = text.find("{"), text.rfind("}") + 1
                if s >= 0 and e > s:
                    return json.loads(text[s:e])
                raise

        def apply_thresholds(review, rules):
            thresholds = rules.get("thresholds", {})
            findings = review.get("findings", [])
            blocks = sum(1 for f in findings if f.get("severity") == "block")
            warns  = sum(1 for f in findings if f.get("severity") == "warn")
            if blocks > thresholds.get("max_block_findings", 0):
                return "block"
            if warns > thresholds.get("max_warn_findings", 5):
                return "block"
            if warns > 0:
                return "warn"
            return review.get("decision", "approve")

        def load_api_key():
            with open(SA_JWT_PATH) as f:
                jwt = f.read().strip()
            login_body = json.dumps({"role": VAULT_ROLE, "jwt": jwt}).encode()
            req = urllib.request.Request(
                f"{VAULT_ADDR}/v1/auth/kubernetes/login",
                data=login_body,
                headers={"Content-Type": "application/json"},
            )
            with urllib.request.urlopen(req, timeout=10) as resp:
                vault_token = json.loads(resp.read())["auth"]["client_token"]
            req = urllib.request.Request(
                f"{VAULT_ADDR}/v1/{VAULT_PATH}",
                headers={"X-Vault-Token": vault_token},
            )
            with urllib.request.urlopen(req, timeout=10) as resp:
                return json.loads(resp.read())["data"]["data"]["api-key"]

        def write_result(path, value):
            with open(path, "w") as f:
                f.write(str(value))

        # ── main ─────────────────────────────────────────────────────────────

        def main():
            print("=" * 60)
            print("  AI CODE REVIEW AGENT")
            print("=" * 60)

            rules   = load_rules()
            enabled = [r for r in rules.get("rules", []) if r.get("enabled", True)]
            print(f"Active rules: {len(enabled)}")

            print("\nGathering code changes...")
            changes = get_code_changes()
            if not changes.strip():
                print("No changes — auto-approving.")
                write_result(DECISION_PATH, "approve")
                write_result(SUMMARY_PATH, "No code changes to review")
                write_result(COUNT_PATH, "0")
                return

            print(f"Reviewing {len(changes):,} characters of code\n")

            api_key = load_api_key()

            llm = ChatAnthropic(model=MODEL, api_key=api_key, max_tokens=4096)
            tools = [run_linter, check_secrets, audit_dependencies, run_tests, read_file]
            agent = create_react_agent(llm, tools)

            print(f"Starting agent ({MODEL})...")
            result = agent.invoke({
                "messages": [
                    ("system", SYSTEM_PROMPT.format(rules=json.dumps(enabled, indent=2))),
                    ("human",
                     f"Review these code changes and use tools where relevant:\n\n"
                     f"```\n{changes}\n```\n\n"
                     "Return your final assessment as a JSON object."),
                ]
            })

            final = result["messages"][-1].content
            if isinstance(final, list):
                final = next((b["text"] for b in final if b.get("type") == "text"), "")

            try:
                review = parse_review(final)
            except Exception as e:
                print(f"WARNING: Could not parse response: {e}", file=sys.stderr)
                print(f"Raw: {final[:500]}", file=sys.stderr)
                write_result(DECISION_PATH, "warn")
                write_result(SUMMARY_PATH, "Review ran but response could not be parsed")
                write_result(COUNT_PATH, "0")
                return

            decision    = apply_thresholds(review, rules)
            summary     = review.get("summary", "No summary")
            findings    = review.get("findings", [])
            suggestions = review.get("suggestions", [])

            print(f"\n{'=' * 60}")
            labels = {"approve": "APPROVED", "warn": "WARNING", "block": "BLOCKED"}
            print(f"  DECISION: {labels.get(decision, decision.upper())}")
            print(f"{'=' * 60}")
            print(f"\n{summary}\n")

            if findings:
                print(f"Findings ({len(findings)}):")
                print("-" * 50)
                for fnd in findings:
                    loc = fnd.get("file", "?")
                    if fnd.get("line"):
                        loc += f":{fnd['line']}"
                    print(f"  [{fnd.get('severity','info').upper()}] {fnd.get('title','Untitled')}")
                    print(f"    at {loc}")
                    print(f"    {fnd.get('description','')}\n")

            if suggestions:
                print("Suggestions:")
                for s in suggestions:
                    print(f"  * {s}")
                print()

            print("=" * 60)
            write_result(DECISION_PATH, decision)
            write_result(SUMMARY_PATH, summary[:4000])
            write_result(COUNT_PATH, str(len(findings)))

            if decision == "block":
                print("Pipeline BLOCKED — fix the issues above and push again.")
                sys.exit(1)
            elif decision == "warn":
                print("Proceeding to build with warnings.")
            else:
                print("All clear — proceeding to build.")

        main()
